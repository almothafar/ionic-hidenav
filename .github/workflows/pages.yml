name: Deploy demo to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:prod

      # The repo name is the Pages sub-path, and the demo uses hash routing so
      # deep links resolve without a 404 fallback.
      - name: Build demo
        run: npx ng build demo --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

      - id: deploy
        uses: actions/deploy-pages@v5
